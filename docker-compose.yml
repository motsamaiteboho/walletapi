services:

  postgres:
    image: postgres:16
    container_name: wallet-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - wallet_postgres_data:/var/lib/postgresql/data


  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: servicebus-emulator
    pull_policy: always

    volumes:
      - ./servicebus/config.json:/ServiceBus_Emulator/ConfigFiles/Config.json

    ports:
      - "5672:5672"
      - "5300:5300"

    environment:
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"
      ACCEPT_EULA: "Y"
      EMULATOR_HTTP_PORT: "5300"
      SQL_WAIT_INTERVAL: "15"

    depends_on:
      - mssql

    networks:
      - servicebus-network


  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: servicebus-mssql

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"

    networks:
      - servicebus-network


volumes:
  wallet_postgres_data:


networks:
  servicebus-network: